<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | Pangan Murah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0F172A] text-slate-200 min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-slate-800 via-[#0F172A] to-[#0F172A]">

    <div class="w-full max-w-lg">
        <a href="index.html" class="inline-flex items-center text-sm text-slate-400 hover:text-green-500 transition-all mb-8 group">
            <span class="mr-2 transform group-hover:-translate-x-1 transition-transform">←</span> 
            Kembali ke Beranda
        </a>
        
        <div class="bg-[#1E293B] p-8 md:p-12 rounded-[2.5rem] border border-white/5 shadow-2xl shadow-black/50">
            <div class="text-center mb-10">
                <div class="text-3xl font-bold tracking-tight text-white mb-2">
                    Pangan<span class="text-green-500">Murah</span>
                </div>
                <p class="text-slate-400 text-sm">
                    Gabung jadi <span class="text-white font-semibold">Food Rescue Hero</span> hari ini!
                </p>
            </div>

            <form action="#" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Nama Lengkap</label>
                    <input type="text" placeholder="Contoh: Indah Permata" required
                           class="w-full bg-[#0F172A] border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all placeholder:text-slate-600">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Alamat Email</label>
                    <input type="email" placeholder="nama@email.com" required
                           class="w-full bg-[#0F172A] border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all placeholder:text-slate-600">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Password</label>
                        <input type="password" placeholder="••••••••" required
                               class="w-full bg-[#0F172A] border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Konfirmasi</label>
                        <input type="password" placeholder="••••••••" required
                               class="w-full bg-[#0F172A] border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all">
                    </div>
                </div>

                <p class="text-xs text-slate-400 leading-relaxed text-center px-4">
                    Dengan mendaftar, kamu menyetujui 
                    <a href="#" class="text-green-500 font-bold hover:underline">Syarat & Ketentuan</a> serta 
                    <a href="#" class="text-green-500 font-bold hover:underline">Kebijakan Privasi</a> kami.
                </p>

                <button type="submit" 
                        class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-black text-white text-lg transition-all transform hover:scale-[1.02] active:scale-95 shadow-xl shadow-green-900/30">
                    Buat Akun Sekarang
                </button>
            </form>

            <p class="mt-10 text-center text-sm text-slate-400">
                Sudah punya akun? 
                <a href="login.html" class="text-green-500 font-bold hover:underline ml-1">Masuk di sini</a>
            </p>
        </div>
    </div>

</body>
</html>
