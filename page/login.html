<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | Pangan Murah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0F172A] text-slate-200 min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-[#0F172A] to-[#0F172A]">

    <div class="w-full max-w-md">
        <a href="index.html" class="inline-flex items-center text-sm text-slate-400 hover:text-green-500 transition-all mb-8 group">
            <span class="mr-2 transform group-hover:-translate-x-1 transition-transform">←</span> 
            Kembali ke Beranda
        </a>
        
        <div class="bg-[#1E293B] p-8 md:p-10 rounded-[2.5rem] border border-white/5 shadow-2xl shadow-black/50">
            <div class="text-center mb-10">
                <div class="text-3xl font-bold tracking-tight text-white mb-2">
                    Pangan<span class="text-green-500">Murah</span>
                </div>
                <p class="text-slate-400 text-sm">
                    Masuk untuk mulai berburu makanan!
                </p>
            </div>

            <form action="#" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Email atau Username</label>
                    <input type="text" placeholder="Masukkan email kamu" required
                           class="w-full bg-[#0F172A] border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all placeholder:text-slate-600">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2 ml-1">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Password</label>
                        <a href="#" class="text-[10px] text-green-500 font-bold hover:underline">Lupa Password?</a>
                    </div>
                    <input type="password" placeholder="••••••••" required
                           class="w-full bg-[#0F172A] border border-white/10 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all">
                </div>

                <button type="submit" 
                        class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-black text-white text-lg transition-all transform hover:scale-[1.02] active:scale-95 shadow-xl shadow-green-900/30">
                    Masuk Sekarang
                </button>

                <div class="flex items-center py-2">
                    <div class="flex-1 h-px bg-white/10"></div>
                    <span class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Atau</span>
                    <div class="flex-1 h-px bg-white/10"></div>
                </div>

                <button type="button" 
                        class="w-full bg-white hover:bg-slate-100 py-4 rounded-2xl font-bold text-slate-900 flex items-center justify-center gap-3 transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5" alt="Google">
                    Masuk dengan Google
                </button>
            </form>

            <p class="mt-10 text-center text-sm text-slate-400">
                Belum punya akun? 
                <a href="register.html" class="text-green-500 font-bold hover:underline ml-1">Daftar Gratis</a>
            </p>
        </div>
    </div>

</body>
</html>
