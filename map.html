<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksplor Peta | Pangan Murah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ping-animation { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen flex flex-col overflow-hidden">

    <header class="p-4 md:p-6 border-b border-white/5 flex justify-between items-center bg-[#0F172A] z-50">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="text-slate-400 hover:text-white transition text-xl">←</a>
            <h1 class="text-lg md:text-xl font-bold text-white">Eksplorasi <span class="text-green-500">Sekitar</span></h1>
        </div>
        <button class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-xl text-xs md:text-sm font-bold transition">
            Buka Maps
        </button>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <aside class="order-2 md:order-1 w-full md:w-80 bg-[#1E293B] border-t md:border-t-0 md:border-r border-white/5 flex flex-col h-[40vh] md:h-full">
            <div class="p-4 border-b border-white/5">
                <input type="text" placeholder="Cari resto..." 
                       class="w-full bg-[#0F172A] border border-white/10 rounded-xl px-4 py-2 text-sm focus:border-green-500 outline-none">
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-3">
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Toko Terdekat</h2>
                
                <div class="p-3 bg-[#0F172A] rounded-xl border border-green-500/30">
                    <div class="flex justify-between text-[10px] mb-1">
                        <span class="text-green-500 font-bold">BUKA</span>
                        <span class="text-slate-500">0.8 km</span>
                    </div>
                    <h3 class="font-bold text-sm text-white">Bakery Cipatat Indah</h3>
                    <p class="text-[11px] text-slate-400">Sisa 5 Paket Mystery Bag</p>
                </div>

                <div class="p-3 bg-[#0F172A]/50 rounded-xl border border-white/5">
                    <div class="flex justify-between text-[10px] mb-1">
                        <span class="text-orange-500 font-bold">HAMPIR HABIS</span>
                        <span class="text-slate-500">1.2 km</span>
                    </div>
                    <h3 class="font-bold text-sm text-white">Warung Nasi Barokah</h3>
                    <p class="text-[11px] text-slate-400">Sisa 2 Porsi</p>
                </div>
            </div>
        </aside>

        <div class="order-1 md:order-2 flex-1 relative bg-[#0F172A] h-[60vh] md:h-full">
            <div class="absolute inset-0 opacity-30 bg-cover bg-center" 
                 style="background-image: url('https://api.mapbox.com/styles/v1/mapbox/dark-v10/static/107.43,-6.83,13/800x600?access_token=pk.xxx');">
            </div>

            <div class="absolute inset-0 flex items-center justify-center p-6 bg-gradient-to-b from-transparent to-[#0F172A]/80">
                <div class="text-center p-6 bg-[#1E293B]/90 backdrop-blur-md rounded-[2rem] border border-white/10 shadow-2xl max-w-xs">
                    <div class="relative w-12 h-12 mx-auto mb-4 flex items-center justify-center">
                        <div class="absolute inset-0 bg-green-500 rounded-full ping-animation opacity-20"></div>
                        <span class="text-3xl relative z-10">📍</span>
                    </div>
                    <h2 class="text-lg font-bold text-white mb-2">Peta Segera Hadir</h2>
                    <p class="text-xs text-slate-400 mb-6">Kami sedang menyiapkan fitur lacak makanan real-time.</p>
                    <button class="w-full bg-green-600 py-3 rounded-xl font-bold text-xs hover:bg-green-500 transition">
                        Gunakan Lokasi Saya
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
